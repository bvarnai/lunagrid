# EVCC Configuration File
# Updated for MQTT-based passive charging state monitoring flow

network:
  schema: http
  host: 0.0.0.0
  port: 7070

mqtt:
  broker: lunagrid-mosquitto:1883

# Site settings
site:
  title: Garage Charging Station
  currency: HUF # Hungarian Forint

chargers:
  - name: rheidon_pc200_3k6
    type: custom
    status:
      source: mqtt
      topic: evcc/charger/status
    enabled:
      source: const
      value: "true"
    enable:
      source: js
      script:
    maxcurrent:
      source: js
      script:
    power:
      source: js
      script: "status === 'C' ? 3680 : 0"
      in:
        - name: status
          type: string
          config:
            source: mqtt
            topic: evcc/charger/status

vehicles:
  - name: my_enyaq
    type: template
    template: skoda
    title: Skoda Enyaq
    user: "bvarnai@gmail.com"
    password: "pkg_nyk3ZNH3uwk*dgk"
    vin: "TMBJB7NY8NF024802"
    capacity: 60
    phases: 1
    cache: 15m
    wakeupdisabled: false
    climaterdisabled: false
    autodetectdisabled: false

loadpoints:
  - title: Garage Charging Station
    charger: rheidon_pc200_3k6
    vehicle: my_enyaq
    mode: now # Default mode
    phases: 1
    mincurrent: 6
    maxcurrent: 16
