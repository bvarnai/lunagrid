# EVCC Configuration File
network:
  schema: http
  host: 0.0.0.0
  port: 7070

chargers:
  - name: rheidon_pc200_3k6
    type: custom
    features:
      - switchdevice # Tells EVCC this is an on/off switchless charger
    status:
      source: http
      uri: http://backend:3000/api/locations/budapest-home-1/telemetry
      jq: if .gridActive then "B" else "A" end
    enabled:
      source: http
      uri: http://backend:3000/api/locations/budapest-home-1/telemetry
      jq: .gridActive
    enable:
      source: script
      cmd: /bin/true # No-op command required by EVCC for custom chargers
    maxcurrent:
      source: const
      value: 16 # Fixed limit of the Rheidon charger

vehicles:
  - name: my_enyaq
    type: template
    template: skoda
    title: Skoda Enyaq
    user: "your_skoda_email@gmail.com"
    password: "your_skoda_password"
    vin: "TMBJB7NY8NFXXXXXX" # Replace with your vehicle's VIN
    capacity: 60             # 60 kWh battery pack
    phases: 1                # Single phase charging

loadpoints:
  - title: Garage Socket (B-Tariff)
    charger: rheidon_pc200_3k6
    vehicle: my_enyaq
    mode: now # Set to now so EVCC charges whenever B-tariff status is 'B'
    phases: 1
    mincurrent: 6
    maxcurrent: 16
