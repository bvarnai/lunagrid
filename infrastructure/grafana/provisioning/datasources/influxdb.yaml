apiVersion: 1

datasources:
  - name: InfluxDB-2
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: lunagrid-org
      defaultBucket: lunagrid-telemetry
    secureJsonData:
      token: lunagrid_secure_pass123
    isDefault: true
