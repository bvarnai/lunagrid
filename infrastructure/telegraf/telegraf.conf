# Telegraf Configuration

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = false
  quiet = false
  hostname = "lunagrid-telegraf"
  omit_hostname = false

# MQTT Consumer Input - Subscribes to device telemetry streams
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = [
    "lunagrid/devices/+/state",
    "lunagrid/devices/+/telemetry"
  ]
  data_format = "json"
  
  # Map payload properties to tags for indexing
  tag_keys = [
    "device_id",
    "event"
  ]

# InfluxDB v2 Output - Sends compiled metrics to the database bucket
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  # The token matches the default setup defined in docker-compose.yml
  token = "lunagrid_secure_pass123" 
  organization = "lunagrid-org"
  bucket = "lunagrid-telemetry"
