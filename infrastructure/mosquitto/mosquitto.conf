# Eclipse Mosquitto Configuration file
# Place in /mosquitto/config/mosquitto.conf inside the container

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Log settings
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Default TCP Listener (unencrypted for local development)
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket Listener (allows web apps to connect directly)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
